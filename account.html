<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta · Belleza Conceptual</title><link rel="stylesheet" href="/store.css"><script defer src="/store-ui.js"></script></head><body data-page="account"><header><a class="brand" href="/">✷ Belleza Conceptual</a><a href="/#catalogo">Tienda</a><a id="admin-link" href="/admin" hidden>Administración</a><button id="logout" hidden>Cerrar sesión</button></header><main><h1>Mi cuenta</h1><p class="muted">Tus datos de entrega y tus pedidos, en un solo lugar.</p><p id="message" class="message" role="status"></p><div id="auth" class="split"><section class="panel"><h2>Iniciar sesión</h2><form id="login"><label for="login-email">Correo electrónico</label><input id="login-email" name="email" type="email" autocomplete="username" required><label for="login-password">Contraseña</label><input id="login-password" name="password" type="password" autocomplete="current-password" required><button>Entrar</button></form></section><section class="panel"><h2>Crear cuenta</h2><form id="register" class="fields"><div class="wide"><label for="register-name">Nombre completo</label><input id="register-name" name="nombre" autocomplete="name" maxlength="200" required></div><div class="wide"><label for="register-email">Correo electrónico</label><input id="register-email" name="email" type="email" autocomplete="email" required></div><div class="wide"><label for="register-password">Contraseña (mínimo 10 caracteres)</label><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div><div><label for="register-phone">Teléfono</label><input id="register-phone" name="telefono" autocomplete="tel" maxlength="30"></div><div><label for="register-address">Dirección</label><input id="register-address" name="direccion" autocomplete="street-address" maxlength="1000"></div><button class="wide">Crear mi cuenta</button></form></section></div><div id="account" hidden><section class="panel"><h2>Datos de entrega</h2><form id="profile" class="fields"><div><label for="profile-name">Nombre</label><input id="profile-name" name="nombre" required></div><div><label for="profile-phone">Teléfono</label><input id="profile-phone" name="telefono" required maxlength="30"></div><div class="wide"><label for="profile-address">Dirección</label><textarea id="profile-address" name="direccion" required maxlength="1000"></textarea></div><button>Guardar datos</button><a class="button" href="/">Continuar comprando</a></form></section><section class="panel"><h2>Mis pedidos</h2><div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Fecha</th><th>Total</th><th>Estado</th><th>Detalle</th></tr></thead><tbody id="orders"></tbody></table></div></section></div><dialog id="detail"><button id="close-detail">Cerrar</button><div id="detail-content"></div></dialog></main></body></html>
