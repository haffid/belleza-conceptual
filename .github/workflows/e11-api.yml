name: E11 API
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [DEV, QA, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    name: E11 / pruebas-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/api
      - name: Ejecutar colección sobre datos aislados
        run: npm run test:api
      - name: Guardar resultados incluso si falla la colección
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e11-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/api/
          if-no-files-found: error
          retention-days: 30
